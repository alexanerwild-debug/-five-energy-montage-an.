name: Find All Note Inputs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Textareas und Notizen lokalisieren
        run: |
          echo "=== ALLE VORKOMMEN VON TEXTAREA ==="
          grep -n -C 2 -i "<textarea" index.html || true

          echo "=== SUCHE NACH NOTIZEN LOGIK ==="
          grep -n -C 2 -i "notiz" index.html | head -n 40 || true
