name: Fix Teams Form Isolation and Inspect Details

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Monteur-Formular isolieren und nur im Teams-Tab anzeigen
        run: |
          python3 -c '
          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()

          # Monteur-Box in einen festen Container packen oder per CSS/ID kapseln
          if "Neuen Monteur anlegen" in content:
              # Falls die Box statisch im Body liegt, ID zuweisen und standardmaessig ausblenden
              import re
              content = re.sub(
                  r"(<div[^>]*?>\s*<h\d[^>]*?>\s*Neuen Monteur anlegen|<h3>\s*Neuen Monteur anlegen|<div class=\"card\"[^>]*?>\s*<h\d>Neuen Monteur anlegen)",
                  r"<div id=\"monteur-create-box\" style=\"display:none;\">\1",
                  content,
                  count=1
              )

          # JS-Hook: Monteur-Box nur anzeigen, wenn Teams aktiv ist
          tab_hook = """
          <script>
          function updateMonteurBoxVisibility() {
            const box = document.getElementById("monteur-create-box");
            if (!box) return;
            const currentHash = window.location.hash || "";
            const teamsActive = currentHash.includes("teams") || document.body.dataset.activeTab === "teams";
            box.style.display = teamsActive ? "block" : "none";
          }
          window.addEventListener("hashchange", updateMonteurBoxVisibility);
          setInterval(updateMonteurBoxVisibility, 500);
          </script>
          </body>"""

          if "</body>" in content and "updateMonteurBoxVisibility" not in content:
              content = content.replace("</body>", tab_hook)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Code von Teams und Foto-Logik inspizieren
        run: |
          echo "=== GENAUE LOCATION VON NEUEN MONTEUR ANLEGEN ==="
          grep -n -C 8 "Neuen Monteur anlegen" index.html || true

          echo "=== TEAM-LISTE UND MONTEUR-VERWALTUNG ==="
          grep -n -C 8 "wfTeam\|renderTeam" index.html || true

          echo "=== FOTO-LOGIK (wfPhotoInput) ==="
          grep -n -A 25 "function wfPhotoInput" index.html || true

      - name: Aenderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Isolate monteur box and inspect photo and team logic" || echo "Keine Aenderung"
          git push
