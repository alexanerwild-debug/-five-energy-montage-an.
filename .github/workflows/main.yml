name: Deploy Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Bei Google Cloud anmelden
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/476970870228/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'firebase-adminsdk-fbsvc@jugendamt-kassel.iam.gserviceaccount.com'

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Firebase CLI installieren
        run: npm install -g firebase-tools

      - name: Abhängigkeiten installieren
        working-directory: functions
        run: npm install

      - name: Firebase Functions bereitstellen
        run: firebase deploy --only functions --project jugendamt-kassel
