name: Fix Mobile Layout, Menu Persistence and Dashboard Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html with clean layout, native sync and resilient menu
        run: |
          python3 - << 'EOF'
          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()

          script_payload = """<script id="roles-dashboard-system">
          window.SUPER_ADMIN_EMAIL = "alexaner.wild@gmail.com";
          window.userRoleCache = null;

          function getCurEmail() {
            try { return (typeof authEmail === "function" && authEmail()) || (currentUser && currentUser.email) || ""; }
            catch(e) { return ""; }
          }

          function isBoss() {
            let em = (getCurEmail() || "").toLowerCase().trim();
            return em === window.SUPER_ADMIN_EMAIL.toLowerCase().trim() || (window.userRoleCache && window.userRoleCache.role === "admin");
          }

          function getAppProject() {
            try {
              if (typeof p === "function") return p();
              if (typeof project !== "undefined" && project) return project;
            } catch(e) {}
            return null;
          }

          function getAppRooms() {
            let proj = getAppProject();
            if (!proj) return [];
            return proj.rooms || (proj.project && proj.project.rooms) || [];
          }

          // Speichert zuverlässig in Firestore und ruft native App-Rerender auf
          async function persistRoomsOnly() {
            let proj = getAppProject();
            let rooms = getAppRooms();

            try {
              if (typeof saveProject === "function") await saveProject();
              else if (typeof save === "function") await save();
            } catch(e) {}

            try {
              if (typeof fsProject === "function") {
                let ref = fsProject();
                if (ref && typeof ref.update === "function") {
                  await ref.update({ rooms: rooms });
                } else if (ref && typeof ref.set === "function") {
                  await ref.set({ rooms: rooms }, { merge: true });
                }
              }
            } catch(e) {}

            try {
              let pid = (typeof curProjectId !== "undefined" && curProjectId) || 
                        (proj && (proj.id || (proj.project && proj.project.id)));
              if (pid && typeof db !== "undefined" && db) {
                await db.collection("projects").doc(pid).update({ rooms: rooms });
              }
            } catch(e) {}

            // Native Render der App antriggern, damit das Übersicht-Dashboard direkt aktualisiert wird
            try {
              if (typeof renderDashboard === "function") renderDashboard();
              if (typeof render === "function") render();
              if (typeof updateStats === "function") updateStats();
            } catch(e) {}
          }

          window.formatSecs = function(ms) {
            let totalSecs = Math.max(0, Math.floor(ms / 1000));
            let h = Math.floor(totalSecs / 3600);
            let m = Math.floor((totalSecs % 3600) / 60);
            let s = totalSecs % 60;
            return (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
          };

          window.getRoomTotalDurationMs = function(r) {
            let sessions = r.workSessions || [];
            let total = 0;
            let now = Date.now();
            if (!sessions.length && r.startedAt) {
              total += ((r.completedAt || now) - r.startedAt);
            } else {
              sessions.forEach(s => {
                let start = s.start || 0;
                let end = s.end || now;
                if (start > 0 && end >= start) total += (end - start);
              });
            }
            return total;
          };

          window.isRoomActive = function(r) {
            if (r.workSessions && r.workSessions.length > 0) {
              let last = r.workSessions[r.workSessions.length - 1];
              return !last.end;
            }
            return (r.status === "in_progress" || (r.startedAt && !r.completedAt));
          };

          window.startRoomWork = async function(rid) {
            let rooms = getAppRooms();
            let room = rooms.find(x => x.id === rid || String(x.id) === String(rid));
            if (!room) return;

            if (!room.workSessions) room.workSessions = [];
            let last = room.workSessions[room.workSessions.length - 1];
            if (!last || last.end) {
              room.workSessions.push({ start: Date.now(), end: null });
            }

            // Alle nativen Status-Felder synchron setzen
            room.status = "in_progress";
            room.montageDone = false;
            room.done = false;
            if (!room.startedAt) room.startedAt = Date.now();
            room.completedAt = null;

            await persistRoomsOnly();
            injectRoomControls();
            if (typeof renderWorkflow === "function") renderWorkflow();
          };

          window.finishRoomWork = async function(rid) {
            let rooms = getAppRooms();
            let room = rooms.find(x => x.id === rid || String(x.id) === String(rid));
            if (!room) return;

            if (room.needsClarification && !room.clarificationResolved) {
              alert("⚠️ Dieser Raum kann nicht abgeschlossen werden: Es ist noch eine offene Klärung vorhanden!");
              return;
            }

            let now = Date.now();
            if (!room.workSessions || !room.workSessions.length) {
              room.workSessions = [{ start: room.startedAt || now, end: now }];
            } else {
              let last = room.workSessions[room.workSessions.length - 1];
              if (!last.end) last.end = now;
            }

            // Native Felder für die Übersicht setzen: 'done' + 'completed' + 'montageDone'
            room.status = "done";
            room.completed = true;
            room.montageDone = true;
            room.done = true;
            room.completedAt = now;

            await persistRoomsOnly();
            injectRoomControls();
            if (typeof renderWorkflow === "function") renderWorkflow();
          };

          window.addExtraSession = async function(rid) {
            let rooms = getAppRooms();
            let room = rooms.find(x => x.id === rid || String(x.id) === String(rid));
            if (!room) return;

            if (!room.workSessions) {
              room.workSessions = [];
              if (room.startedAt) {
                room.workSessions.push({ start: room.startedAt, end: room.completedAt || Date.now() });
              }
            }

            room.workSessions.push({ start: Date.now(), end: null });
            room.status = "in_progress";
            room.montageDone = false;
            room.done = false;

            await persistRoomsOnly();
            injectRoomControls();
            if (typeof renderWorkflow === "function") renderWorkflow();
          };

          window.stopExtraSession = async function(rid) {
            let rooms = getAppRooms();
            let room = rooms.find(x => x.id === rid || String(x.id) === String(rid));
            if (!room) return;

            let now = Date.now();
            if (room.workSessions && room.workSessions.length > 0) {
              let last = room.workSessions[room.workSessions.length - 1];
              if (!last.end) last.end = now;
            }

            room.status = "done";
            room.montageDone = true;
            room.done = true;
            room.completedAt = now;

            await persistRoomsOnly();
            injectRoomControls();
            if (typeof renderWorkflow === "function") renderWorkflow();
          };

          // Saubere, responsive Leiste (kein Überlauf, wrap-fähig)
          window.getRoomStatusSnippet = function(r) {
            let active = isRoomActive(r);
            let isDone = (r.status === "done" || r.status === "completed" || r.montageDone || (r.completedAt && !active));
            let totalMs = getRoomTotalDurationMs(r);
            let timeStr = formatSecs(totalMs);
            let sessCount = (r.workSessions || []).length;

            let badge = '<span style="padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;background:#fee2e2;color:#ef4444;white-space:nowrap;">Offen</span>';
            if (isDone) {
              badge = '<span style="padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;background:#dcfce7;color:#16a34a;white-space:nowrap;">✔ Abgeschlossen (' + timeStr + ')</span>';
            } else if (active) {
              badge = '<span id="timer-badge-' + r.id + '" style="padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;background:#fef3c7;color:#d97706;white-space:nowrap;">⏱ In Arbeit (' + timeStr + ')</span>';
            }

            let btn1 = "";
            if (!active && !isDone) {
              btn1 = '<button type="button" class="btn green" style="width:auto;padding:5px 10px;margin:2px;font-size:11px;white-space:nowrap;" onclick="event.stopPropagation();startRoomWork(\\'' + r.id + '\\')">▶ Start</button>';
            } else if (active && !r.completedAt) {
              btn1 = '<button type="button" class="btn green" style="width:auto;padding:5px 10px;margin:2px;font-size:11px;background:#10b981;white-space:nowrap;" onclick="event.stopPropagation();finishRoomWork(\\'' + r.id + '\\')">✔ Fertig</button>';
            } else {
              btn1 = '<button type="button" class="btn" style="width:auto;padding:5px 10px;margin:2px;font-size:11px;background:#e2e8f0;color:#64748b;white-space:nowrap;cursor:default;" disabled>✔ Fertig</button>';
            }

            let btn2 = "";
            if (isDone) {
              btn2 = '<button type="button" class="btn" style="width:auto;padding:5px 10px;margin:2px;font-size:11px;background:#3b82f6;color:#fff;white-space:nowrap;" onclick="event.stopPropagation();addExtraSession(\\'' + r.id + '\\')">➕ Nacharbeit</button>';
            } else if (active && r.completedAt) {
              btn2 = '<button type="button" class="btn" style="width:auto;padding:5px 10px;margin:2px;font-size:11px;background:#f59e0b;color:#fff;white-space:nowrap;" onclick="event.stopPropagation();stopExtraSession(\\'' + r.id + '\\')">⏹ Pause</button>';
            }

            return '<div class="room-session-box" data-injected-id="' + r.id + '" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:6px 0;margin:4px 0;width:100%;box-sizing:border-box;">' +
                   badge +
                   '<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">' + btn1 + btn2 + '</div>' +
                   '</div>';
          };

          // Verhindert doppelte Buttons und platziert die Leiste exakt EINMAL pro Raumkarte
          function injectRoomControls() {
            let rooms = getAppRooms();
            rooms.forEach(r => {
              let active = isRoomActive(r);
              let isDone = (r.status === "done" || r.status === "completed" || r.montageDone || (r.completedAt && !active));
              let timeStr = formatSecs(getRoomTotalDurationMs(r));

              // Alle Raum-Köpfe finden
              let elements = document.querySelectorAll(`[data-id="${r.id}"], [data-room-id="${r.id}"]`);
              if (!elements.length) {
                // Fallback über Text-Inhalt
                document.querySelectorAll(".room-header, .room-card, details").forEach(el => {
                  if (r.name && el.textContent.includes(r.name)) {
                    // Bereits vorhanden?
                    let existing = el.querySelector(`.room-session-box[data-injected-id="${r.id}"]`);
                    if (existing) {
                      existing.outerHTML = getRoomStatusSnippet(r);
                    } else {
                      let anchor = el.querySelector("summary, .header, h3, h4") || el;
                      anchor.insertAdjacentHTML("afterend", getRoomStatusSnippet(r));
                    }
                  }
                });
              } else {
                elements.forEach(el => {
                  let existing = el.querySelector(`.room-session-box[data-injected-id="${r.id}"]`);
                  if (existing) {
                    existing.outerHTML = getRoomStatusSnippet(r);
                  } else {
                    el.insertAdjacentHTML("afterbegin", getRoomStatusSnippet(r));
                  }
                });
              }

              let timerBadge = document.getElementById("timer-badge-" + r.id);
              if (timerBadge && active) {
                timerBadge.textContent = "⏱ In Arbeit (" + timeStr + ")";
              }
            });
          }

          // Dauerhafter Menü-Wächter: Stellt sicher, dass das PM-Menü NIE verschwindet
          function ensurePmNavExists() {
            let aside = document.querySelector("aside.side");
            if (!aside) return;

            let pmGroup = document.getElementById("pmNavGroup");
            if (!pmGroup) {
              let div = document.createElement("div");
              div.id = "pmNavGroup";
              div.style.cssText = "margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #cbd5e1;";
              div.innerHTML = `
                <div style="font-size:11px;font-weight:700;color:#94a3b8;padding:4px 8px;text-transform:uppercase;">Projektleiter</div>
                <button type="button" id="btnPmCockpit" style="width:100%;text-align:left;display:flex;align-items:center;gap:6px;padding:8px 10px;margin:2px 0;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;">📊 Cockpit</button>
                <button type="button" id="btnPmProg" style="width:100%;text-align:left;display:flex;align-items:center;gap:6px;padding:8px 10px;margin:2px 0;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;">💻 Programmieren</button>
              `;
              aside.insertBefore(div, aside.firstChild);
              bindPmButtons();
            }

            let admin = isBoss();
            let el = document.getElementById("pmNavGroup");
            if (el) el.style.display = admin ? "block" : "none";
          }

          function bindPmButtons() {
            let btnCockpit = document.getElementById("btnPmCockpit");
            if (btnCockpit) {
              btnCockpit.onclick = function() {
                document.querySelectorAll("main > div, main > section").forEach(d => {
                  if (d.id !== "pmCockpitContainer") d.style.display = "none";
                });
                let c = document.getElementById("pmCockpitContainer");
                if (c) { c.style.display = "block"; renderPmCockpit(); }
              };
            }

            let btnProg = document.getElementById("btnPmProg");
            if (btnProg) {
              btnProg.onclick = function() {
                document.querySelectorAll("main > div, main > section").forEach(d => {
                  if (d.id !== "programmierenContainer") d.style.display = "none";
                });
                let c = document.getElementById("programmierenContainer");
                if (c) { c.style.display = "block"; renderProgrammieren(); }
              };
            }

            document.querySelectorAll("aside.side button:not(#btnPmCockpit):not(#btnPmProg)").forEach(btn => {
              btn.onclick = (function(orig) {
                return function(e) {
                  let c1 = document.getElementById("pmCockpitContainer");
                  let c2 = document.getElementById("programmierenContainer");
                  if (c1) c1.style.display = "none";
                  if (c2) c2.style.display = "none";
                  if (typeof orig === "function") orig.call(this, e);
                };
              })(btn.onclick);
            });
          }

          // PM-Cockpit Rendering
          window.renderPmCockpit = function() {
            let container = document.getElementById("pmCockpitContainer");
            if (!container) return;
            let rooms = getAppRooms();
            let total = rooms.length;
            let done = 0;
            let inP = 0;
            let totalMs = 0;
            let totalComps = 0;
            let installedComps = 0;

            rooms.forEach(r => {
              let comps = (r.components || []).length || (r.devices || []).length || 0;
              totalComps += comps;
              totalMs += getRoomTotalDurationMs(r);

              let active = isRoomActive(r);
              let isDone = (r.status === "done" || r.status === "completed" || r.montageDone || (r.completedAt && !active));

              if (active) inP++;
              else if (isDone) {
                done++;
                installedComps += comps;
              }
            });

            let open = Math.max(0, total - done - inP);
            let remainingComps = Math.max(0, totalComps - installedComps);

            let rows = rooms.map(r => {
              let rActive = isRoomActive(r);
              let rDone = (r.status === "done" || r.status === "completed" || r.montageDone || (r.completedAt && !rActive));
              let statusLabel = rDone ? '<span style="color:#16a34a;font-weight:700;">Fertig</span>' : (rActive ? '<span style="color:#d97706;font-weight:700;">In Arbeit</span>' : '<span style="color:#ef4444;font-weight:700;">Offen</span>');
              let comps = (r.components || []).length || (r.devices || []).length || 0;
              return '<tr style="border-bottom:1px solid #e2e8f0;font-size:13px;"><td style="padding:8px 4px;font-weight:600;">' + (r.name || r.id) + '</td><td style="padding:8px 4px;">' + (r.team || "-") + '</td><td style="padding:8px 4px;">' + statusLabel + '</td><td style="padding:8px 4px;text-align:center;">' + comps + '</td><td style="padding:8px 4px;text-align:right;">' + formatSecs(getRoomTotalDurationMs(r)) + '</td></tr>';
            }).join("");

            container.innerHTML = `
              <div style="padding: 16px;">
                <h2 style="margin-top:0;">📊 Projektleiter-Cockpit</h2>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;">
                  <div style="background:#f8fafc;border:1px solid #cbd5e1;padding:12px;border-radius:8px;text-align:center;">
                    <div style="font-size:12px;color:#64748b;font-weight:600;">GESAMTARBEITSZEIT</div>
                    <b style="font-size:20px;color:#0f172a;">${formatSecs(totalMs)}</b>
                  </div>
                  <div style="background:#fee2e2;color:#ef4444;padding:12px;border-radius:8px;text-align:center;">
                    <div style="font-size:12px;font-weight:600;">OFFENE RÄUME</div>
                    <b style="font-size:20px;">${open}</b>
                  </div>
                  <div style="background:#fef3c7;color:#d97706;padding:12px;border-radius:8px;text-align:center;">
                    <div style="font-size:12px;font-weight:600;">IN ARBEIT</div>
                    <b style="font-size:20px;">${inP}</b>
                  </div>
                  <div style="background:#dcfce7;color:#16a34a;padding:12px;border-radius:8px;text-align:center;">
                    <div style="font-size:12px;font-weight:600;">FERTIG</div>
                    <b style="font-size:20px;">${done} / ${total}</b>
                  </div>
                </div>

                <div style="background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:14px;margin-bottom:16px;">
                  <div style="font-weight:700;margin-bottom:8px;">📦 Komponenten-Status</div>
                  <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0;"><span>Gesamt erfasst:</span><b>${totalComps} Stk.</b></div>
                  <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:#16a34a;"><span>Bereits verbaut:</span><b>${installedComps} Stk.</b></div>
                  <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:#ef4444;"><span>Noch zu verbauen:</span><b>${remainingComps} Stk.</b></div>
                </div>

                <div style="background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:14px;overflow-x:auto;">
                  <div style="font-weight:700;margin-bottom:8px;">📋 Raumübersicht & Montagezeiten</div>
                  <table style="width:100%;border-collapse:collapse;">
                    <thead>
                      <tr style="border-bottom:2px solid #cbd5e1;font-size:12px;color:#64748b;text-align:left;">
                        <th style="padding:6px 4px;">Raum</th>
                        <th style="padding:6px 4px;">Team</th>
                        <th style="padding:6px 4px;">Status</th>
                        <th style="padding:6px 4px;text-align:center;">Komp.</th>
                        <th style="padding:6px 4px;text-align:right;">Zeit</th>
                      </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                </div>
              </div>
            `;
          };

          // Programmieren Rendering
          window.renderProgrammieren = function() {
            let container = document.getElementById("programmierenContainer");
            if (!container) return;
            let proj = getAppProject();
            let programmed = (proj && proj.programmedComponents) || {};

            let rooms = getAppRooms();
            let compCounts = {};
            rooms.forEach(r => {
              let comps = (r.components || []).concat(r.devices || []);
              comps.forEach(c => {
                let name = c.name || c.type || "Standard-Komponente";
                compCounts[name] = (compCounts[name] || 0) + 1;
              });
            });

            let keys = Object.keys(compCounts);
            let rows = "";
            if (!keys.length) {
              rows = '<tr><td colspan="4" style="padding:12px;text-align:center;color:#64748b;">Noch keine Komponenten in den Räumen erfasst.</td></tr>';
            } else {
              rows = keys.map(k => {
                let required = compCounts[k];
                let doneCount = programmed[k] || 0;
                let diff = required - doneCount;
                return `
                  <tr style="border-bottom:1px solid #e2e8f0;font-size:13px;">
                    <td style="padding:10px 6px;font-weight:600;">${k}</td>
                    <td style="padding:10px 6px;text-align:center;">${required}</td>
                    <td style="padding:10px 6px;text-align:center;">
                      <input type="number" min="0" value="${doneCount}" style="width:60px;padding:4px;text-align:center;border:1px solid #cbd5e1;border-radius:4px;" onchange="updateProgrammedCount('${k}', this.value)" />
                    </td>
                    <td style="padding:10px 6px;text-align:right;font-weight:700;color:${diff <= 0 ? '#16a34a' : '#ef4444'};">${diff <= 0 ? '✔ Abgeschlossen' : 'Noch ' + diff + ' nötig'}</td>
                  </tr>
                `;
              }).join("");
            }

            container.innerHTML = `
              <div style="padding: 16px;">
                <h2 style="margin-top:0;">💻 Komponenten programmieren (Anlernen)</h2>
                <p style="color:#64748b;font-size:13px;">Abgleich zwischen den erfassten Komponenten und den vorab programmierten Einheiten.</p>
                <div style="background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:14px;overflow-x:auto;">
                  <table style="width:100%;border-collapse:collapse;">
                    <thead>
                      <tr style="border-bottom:2px solid #cbd5e1;font-size:12px;color:#64748b;text-align:left;">
                        <th style="padding:6px 6px;">Komponente</th>
                        <th style="padding:6px 6px;text-align:center;">Bedarf</th>
                        <th style="padding:6px 6px;text-align:center;">Angelernt</th>
                        <th style="padding:6px 6px;text-align:right;">Status</th>
                      </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                </div>
              </div>
            `;
          };

          window.updateProgrammedCount = async function(compName, val) {
            let proj = getAppProject();
            if (!proj) return;
            if (!proj.programmedComponents) proj.programmedComponents = {};
            proj.programmedComponents[compName] = parseInt(val, 10) || 0;
            try {
              if (typeof fsProject === "function") {
                await fsProject().update({ programmedComponents: proj.programmedComponents });
              }
            } catch(e){}
            renderProgrammieren();
          };

          // Kontinuierliche Absicherung für UI und Menü
          setInterval(() => {
            ensurePmNavExists();
            injectRoomControls();
          }, 800);
          </script>"""

          import re
          if 'id="roles-dashboard-system"' in content:
              content = re.sub(r'<script id="roles-dashboard-system">[\s\S]*?<\/script>', script_payload.strip(), content)
          else:
              content = content.replace("</body>", script_payload.strip() + "\n</body>")

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Fix mobile layout overflow, menu persistence and native dashboard sync" || echo "Keine Aenderung"
          git pull --rebase origin main
          git push origin main
