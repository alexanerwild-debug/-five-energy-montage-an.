name: Inspect Photo Upload and Fix UI Issues

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-improve:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Menue-Styling vergroessern und Monteur-Formular isolieren
        run: |
          python3 -c '
          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Menue-Elemente vergroessern, Abstaende erhoehen und echte Icons setzen
          icon_replacements = [
              ("⌂ Übersicht", "🏠 Übersicht"),
              ("Übersicht", "🏠 Übersicht"),
              ("▣ Projekte & Archiv", "📁 Projekte & Archiv"),
              ("Projekte & Archiv", "📁 Projekte & Archiv"),
              ("■ Aufnahme Räume & Bestand", "📝 Aufnahme Räume"),
              ("Aufnahme Räume & Bestand", "📝 Aufnahme Räume"),
              ("▤ Pläne", "🗺️ Pläne"),
              ("Pläne", "🗺️ Pläne"),
              ("✓ Montage", "🔧 Montage"),
              ("■ Hauptkomponenten", "⚡ Hauptkomponenten"),
              ("Hauptkomponenten", "⚡ Hauptkomponenten"),
              ("♙ Teams", "👥 Teams"),
              ("Teams", "👥 Teams"),
              ("◇ Komponenten", "📦 Komponenten"),
              ("Komponenten", "📦 Komponenten"),
              ("Arbeitsvorbereitung", "🧰 Arbeitsvorbereitung"),
              ("Montageanleitungen", "📖 Montageanleitungen")
          ]

          # Dopplungen vermeiden
          for old_t, new_t in icon_replacements:
              if new_t not in content and old_t in content:
                  content = content.replace(old_t, new_t)

          # CSS fuer deutlich lesbareres Seitenmenue ergaenzen
          menu_css = """
          <style id="custom-menu-style">
            .navItem {
              font-size: 16px !important;
              font-weight: 600 !important;
              padding: 12px 16px !important;
              display: flex !important;
              align-items: center !important;
              gap: 10px !important;
              border-radius: 8px !important;
              margin: 4px 8px !important;
            }
            .navSection, .navCategory, .navTitle {
              font-size: 12px !important;
              font-weight: 800 !important;
              letter-spacing: 0.8px !important;
              padding: 14px 16px 6px 16px !important;
            }
          </style>
          </head>"""
          if "</head>" in content and "custom-menu-style" not in content:
              content = content.replace("</head>", menu_css)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Foto-Upload und Monteur-Kasten inspizieren
        run: |
          echo "=== SUCHE NACH WFPHOTOINPUT ==="
          grep -n -C 10 "function wfPhotoInput" index.html || true

          echo "=== SUCHE NACH MONTEUR ANLEGEN FORMULAR ==="
          grep -n -C 10 "Neuen Monteur anlegen" index.html || true

      - name: Aenderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Improve sidebar typography and icons" || echo "Keine Aenderung"
          git push
