name: Inspect Dashboard Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-dash:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Dashboard HTML und Render-Logik auslesen
        run: |
          echo "=== DASHBOARD HTML ABSCHNITT ==="
          grep -n -C 10 'data-view="dashboard"' index.html || grep -n -C 10 'id="dashboard"' index.html || grep -n -C 10 'id="dash"' index.html || true

          echo "=== RENDERDASH FUNKTION ORIGINAL ==="
          sed -n '150,230p' index.html | grep -n -C 5 "renderDash" || true
