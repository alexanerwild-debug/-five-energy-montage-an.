name: Deploy Admin Dashboard and Role System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Admin Dashboard, Rollen und Status-Zeiten einbetten
        run: |
          cat << 'EOF' > patch_roles.js
          const fs = require("fs");
          let content = fs.readFileSync("index.html", "utf8");

          const rolesAndDashboardScript = `
          <script id="roles-dashboard-system">
          // 1. Rollen- und Benutzererkennung
          window.SUPER_ADMIN_EMAIL = "alexaner.wild@gmail.com";
          window.userRoleCache = null;

          window.getCurrentUserEmail = function() {
            try {
              return (typeof authEmail === "function" && authEmail()) || (currentUser && currentUser.email) || "";
            } catch(e) {
              return "";
            }
          };

          window.isUserAdmin = function() {
            let email = (window.getCurrentUserEmail() || "").toLowerCase().trim();
            if (email === window.SUPER_ADMIN_EMAIL.toLowerCase().trim()) return true;
            if (window.userRoleCache && window.userRoleCache.role === "admin") return true;
            return false;
          };

          window.getCurrentMonteurTeam = function() {
            if (window.isUserAdmin()) return null; // Admin sieht alles
            if (window.userRoleCache && window.userRoleCache.team) return window.userRoleCache.team;
            let email = window.getCurrentUserEmail();
            return email ? email.split("@")[0] : null;
          };

          // 2. Rollenberechtigung laden und Navigationsleiste anpassen
          async function checkRoleAndAdjustUI() {
            let email = window.getCurrentUserEmail();
            if (!email) return;

            try {
              if (typeof db !== "undefined" && db) {
                let snap = await db.collection("app_users").doc(email.toLowerCase()).get();
                if (snap.exists) {
                  window.userRoleCache = snap.data();
                }
              }
            } catch(err) {
              console.warn("Konnte User-Rolle nicht aus Firestore laden:", err);
            }

            let admin = window.isUserAdmin();
            document.querySelectorAll("aside.side button[data-tab]").forEach(btn => {
              let tab = btn.getAttribute("data-tab");
              if (!admin && (tab === "projekte" || tab === "teams" || tab === "finanzen")) {
                btn.style.display = "none";
              } else {
                btn.style.display = "";
              }
            });

            if (!admin) {
              let activeBtn = document.querySelector("aside.side button.active");
              if (activeBtn && (activeBtn.getAttribute("data-tab") === "projekte" || activeBtn.getAttribute("data-tab") === "teams")) {
                let montBtn = document.querySelector('aside.side button[data-tab="montage"]');
                if (montBtn) montBtn.click();
              }
            }
          }

          if (typeof auth !== "undefined" && auth) {
            auth.onAuthStateChanged(() => {
              setTimeout(checkRoleAndAdjustUI, 300);
            });
          }

          // 3. Status und Zeiterfassung (Starten / Abschliessen)
          window.startRoomWork = async function(rid) {
            try {
              let proj = p();
              let room = proj.rooms.find(x => x.id === rid);
              if (!room) return;
              room.startedAt = Date.now();
              room.status = "in_progress";
              await fsProject().update({ rooms: proj.rooms });
              if (typeof render === "function") render();
              if (typeof toast === "function") toast("Raum-Arbeit gestartet");
            } catch(e) {
              alert("Fehler beim Starten: " + e.message);
            }
          };

          window.finishRoomWork = async function(rid) {
            try {
              let proj = p();
              let room = proj.rooms.find(x => x.id === rid);
              if (!room) return;
              room.completedAt = Date.now();
              room.status = "completed";
              await fsProject().update({ rooms: proj.rooms });
              if (typeof render === "function") render();
              if (typeof toast === "function") toast("Raum erfolgreich abgeschlossen");
            } catch(e) {
              alert("Fehler beim Abschließen: " + e.message);
            }
          };

          // 4. Hook in wfRoomHtml: Monteur-Filter, Zeiterfassung & Buttons
          if (typeof wfRoomHtml === "function") {
            const original_wfRoomHtml = wfRoomHtml;
            wfRoomHtml = function(r, mode) {
              let myTeam = window.getCurrentMonteurTeam();
              if (myTeam && r.team && r.team.trim() !== "" && r.team.toLowerCase().trim() !== myTeam.toLowerCase().trim()) {
                return ""; // Fremder Raum fuer Monteur ausgeblendet
              }

              let html = original_wfRoomHtml(r, mode);

              let statusBadge = '<span style="padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; background:#fee2e2; color:#ef4444;">Offen</span>';
              if (r.status === "in_progress" || (r.startedAt && !r.completedAt)) {
                statusBadge = '<span style="padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; background:#fef3c7; color:#d97706;">In Arbeit</span>';
              } else if (r.status === "completed" || r.completedAt) {
                statusBadge = '<span style="padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; background:#dcfce7; color:#16a34a;">Fertig</span>';
              }

              let timeInfo = "";
              if (r.startedAt && r.completedAt) {
                let diffMins = Math.round((r.completedAt - r.startedAt) / 60000);
                let hours = Math.floor(diffMins / 60);
                let mins = diffMins % 60;
                let durationStr = hours > 0 ? `${hours}h${mins}m` : `${mins}m`;
                timeInfo = `<div style="font-size:11px; color:#64748b; margin-top:2px;">Dauer: <b>${durationStr}</b></div>`;
              } else if (r.startedAt) {
                timeInfo = '<div style="font-size:11px; color:#d97706; margin-top:2px;">Läuft seit: ' + new Date(r.startedAt).toLocaleTimeString([], {hour: "2-digit", minute:"2-digit"}) + '</div>';
              }

              let actionButtons = '<div style="margin-top:8px; display:flex; gap:8px;">';
              if (!r.startedAt) {
                actionButtons += `<button type="button" class="btn green" style="width:auto; padding:6px 12px; font-size:12px; margin:0;" onclick="startRoomWork('${r.id}')">▶ Raum starten</button>`;
              } else if (!r.completedAt) {
                actionButtons += `<button type="button" class="btn green" style="width:auto; padding:6px 12px; font-size:12px; margin:0; background:#10b981;" onclick="finishRoomWork('${r.id}')">✔ Raum abschließen</button>`;
              }
              actionButtons += '</div>';

              let injection = `<div style="margin:4px 0 8px 0; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;">
                <div style="display:flex; align-items:center; gap:8px;">
                  ${statusBadge}${timeInfo}
                </div>
                ${actionButtons}
              </div>`;

              return html.replace('class="wfHead">', 'class="wfHead">' + injection);
            };
          }

          // 5. Admin-Dashboard Widget direkt an #stats anhängen
          function updateAdminDashboardWidget() {
            let proj = (typeof p === "function") ? p() : null;
            let targetEl = document.getElementById("stats");
            if (!proj || !proj.rooms || !targetEl) return;

            let total = proj.rooms.length;
            let completed = proj.rooms.filter(r => r.completedAt || r.status === "completed").length;
            let inProgress = proj.rooms.filter(r => (r.startedAt && !r.completedAt) || r.status === "in_progress").length;
            let open = total - completed - inProgress;

            let teamStats = {};
            proj.rooms.forEach(r => {
              let t = r.team ? r.team.trim() : "Nicht zugewiesen";
              if (!teamStats[t]) teamStats[t] = { total: 0, completed: 0, inProgress: 0, totalMinutes: 0 };
              teamStats[t].total++;
              if (r.completedAt || r.status === "completed") {
                teamStats[t].completed++;
                if (r.startedAt && r.completedAt) {
                  teamStats[t].totalMinutes += Math.round((r.completedAt - r.startedAt) / 60000);
                }
              } else if (r.startedAt || r.status === "in_progress") {
                teamStats[t].inProgress++;
              }
            });

            let teamCardsHtml = Object.keys(teamStats).map(t => {
              let s = teamStats[t];
              let h = Math.floor(s.totalMinutes / 60);
              let m = s.totalMinutes % 60;
              let dur = h > 0 ? `${h}h${m}m` : `${m}m`;
              let pct = s.total > 0 ? Math.round((s.completed / s.total) * 100) : 0;
              return `
                <div style="background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:12px; margin-bottom:8px;">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b style="font-size:13px; color:#1e293b;">${t}</b>
                    <span style="font-size:12px; font-weight:700; color:#3b82f6;">${s.completed} / ${s.total} Fertig (${pct}%)</span>
                  </div>
                  <div style="font-size:11px; color:#64748b; margin-top:4px;">
                    🟡 ${s.inProgress} in Arbeit · ⏱ Gesamtzeit: <b>${dur}</b>
                  </div>
                </div>
              `;
            }).join("");

            let adminWidget = document.getElementById("adminStatusBoard");
            if (!adminWidget) {
              adminWidget = document.createElement("div");
              adminWidget.id = "adminStatusBoard";
              adminWidget.style.cssText = "margin-top:16px; margin-bottom:16px; padding:16px; background:#f8fafc; border-radius:10px; border:1px solid #cbd5e1;";
              targetEl.parentNode.insertBefore(adminWidget, targetEl.nextSibling);
            }

            adminWidget.innerHTML = `
              <h3 style="margin:0 0 12px 0; font-size:15px; color:#0f172a; display:flex; justify-content:space-between; align-items:center;">
                <span>📊 Bauleiter Dashboard</span>
                <span style="font-size:12px; font-weight:normal; background:#e2e8f0; padding:2px 8px; border-radius:6px;">Five Energy & McBride</span>
              </h3>
              <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:14px; text-align:center;">
                <div style="background:#fee2e2; color:#ef4444; padding:8px; border-radius:6px;">
                  <div style="font-size:18px; font-weight:bold;">${open}</div>
                  <div style="font-size:10px; text-transform:uppercase;">Offen</div>
                </div>
                <div style="background:#fef3c7; color:#d97706; padding:8px; border-radius:6px;">
                  <div style="font-size:18px; font-weight:bold;">${inProgress}</div>
                  <div style="font-size:10px; text-transform:uppercase;">In Arbeit</div>
                </div>
                <div style="background:#dcfce7; color:#16a34a; padding:8px; border-radius:6px;">
                  <div style="font-size:18px; font-weight:bold;">${completed}</div>
                  <div style="font-size:10px; text-transform:uppercase;">Fertig</div>
                </div>
              </div>
              <div style="font-size:12px; font-weight:700; color:#475569; margin-bottom:6px;">Team-Fortschritt & Zeiten:</div>
              ${teamCardsHtml}
            `;
          }

          if (typeof renderDash === "function") {
            const original_renderDash = renderDash;
            renderDash = function() {
              original_renderDash();
              updateAdminDashboardWidget();
            };
          }
          setInterval(updateAdminDashboardWidget, 2000);
          </script>`;

          if (!content.includes('id="roles-dashboard-system"')) {
            content = content.replace("</body>", rolesAndDashboardScript + "\n</body>");
          } else {
            content = content.replace(/<script id="roles-dashboard-system">[\s\S]*?<\/script>/, rolesAndDashboardScript);
          }

          fs.writeFileSync("index.html", content, "utf8");
          console.log("Admin Dashboard und Rollen-System erfolgreich integriert!");
          EOF

          node patch_roles.js
          rm patch_roles.js

      - name: Aenderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Fix dashboard container target and inject role tracking" || echo "Keine Aenderung"
          git push
