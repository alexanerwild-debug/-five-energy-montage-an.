name: Apply Teams Fix and State Retention

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Code patchen mit Node.js
        run: |
          node -e '
          const fs = require("fs");
          let content = fs.readFileSync("index.html", "utf8");

          // 1. fsProjects zu fsProject korrigieren
          content = content.split("fsProjects().doc(proj.id)").join("fsProject()");
          content = content.split("fsProjects()").join("fsProject()");

          // 2. Entfernen-Funktion absolut absichern mit fsProject()
          const fixedRemove = `
          <script id="clean-remove-member">
          window.removeTeamMember = async function(name) {
            if (!confirm("Möchtest du " + name + " wirklich entfernen?")) return;
            try {
              let proj = (typeof p === "function") ? p() : null;
              if (!proj || !proj.id) return;
              let currentTeams = proj.teams || [];
              let updated = currentTeams.filter(t => t !== name);
              await fsProject().update({ teams: updated });
              if (typeof toast === "function") toast("Monteur entfernt");
            } catch (e) {
              console.error(e);
              alert("Fehler beim Entfernen: " + e.message);
            }
          };
          </script>`;
          if (!content.includes("clean-remove-member")) {
            content = content.replace("</body>", fixedRemove + "\n</body>");
          }

          // 3. Raum-Offen Zustand merken und nach Render wiederherstellen
          const statePreserver = `
          <script id="preserve-rooms-state">
          let globalOpenRooms = new Set();
          document.addEventListener("toggle", function(e) {
            if (e.target && e.target.tagName === "DETAILS") {
              let s = e.target.querySelector("summary");
              let title = s ? s.innerText.trim() : "";
              if (!title) return;
              if (e.target.open) {
                globalOpenRooms.add(title);
              } else {
                globalOpenRooms.delete(title);
              }
            }
          }, true);

          const roomObserver = new MutationObserver(() => {
            document.querySelectorAll("details").forEach(d => {
              let s = d.querySelector("summary");
              let title = s ? s.innerText.trim() : "";
              if (title && globalOpenRooms.has(title) && !d.open) {
                d.open = true;
              }
            });
          });
          window.addEventListener("DOMContentLoaded", () => {
            roomObserver.observe(document.body, { childList: true, subtree: true });
          });
          </script>`;
          if (!content.includes("preserve-rooms-state")) {
            content = content.replace("</body>", statePreserver + "\n</body>");
          }

          // 4. Monteur-Kasten physikalisch nur an den Teams-View haengen
          const cardIdx = content.indexOf("Neuen Monteur anlegen");
          if (cardIdx !== -1) {
            const startCard = content.lastIndexOf("<div", cardIdx);
            const endCard = content.indexOf("</button>", cardIdx);
            if (startCard !== -1 && endCard !== -1) {
              const closeDiv = content.indexOf("</div>", endCard);
              if (closeDiv !== -1) {
                const fullCard = content.slice(startCard, closeDiv + 6);
                // Entfernen aus alter Position
                content = content.replace(fullCard, "");
                // In den Teams Container einfuegen
                if (content.includes("id=\"teamList\"")) {
                  content = content.replace("id=\"teamList\"></div>", "id=\"teamList\"></div>\n<div style=\"margin-top:20px;\">" + fullCard + "</div>");
                }
              }
            }
          }

          fs.writeFileSync("index.html", content, "utf8");
          console.log("Erfolgreich gepatcht!");
          '

      - name: Aenderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Fix delete function, isolate monteur card to teams view, retain room state" || echo "Keine Aenderung"
          git push
