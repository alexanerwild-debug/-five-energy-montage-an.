name: Find Notes Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: JS-Code fuer Notizen finden
        run: |
          echo "=== SUCHE NACH NOTIZ-FUNKTIONEN IM SCRIPT ==="
          grep -n -C 10 -i "notiz" index.html | grep -E "(function|addEventListener|input|render)" -C 3 || true
          echo "=== SUCHE NACH TEXTAREA EVENT HIER ==="
          grep -n -C 10 "<textarea" index.html || true
