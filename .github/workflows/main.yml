name: Inspect Workflow and Room Logic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-code:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Workflow, Render und Raum-Logik auslesen
        run: |
          echo "=== RENDERWORKFLOW / MONTAGE-LISTE ==="
          grep -n -C 8 "function renderWorkflow" index.html || true

          echo "=== RENDERDASH / DASHBOARD ==="
          grep -n -C 8 "function renderDash" index.html || true

          echo "=== RENDERPLANS ==="
          grep -n -C 8 "function renderPlans" index.html || true
