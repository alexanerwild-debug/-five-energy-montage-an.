name: Permanent Room Header Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert Status Bar Directly into wfRoomHtml Source
        run: |
          python3 - << 'EOF'
          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Start- und Finish-Funktionen global bereitstellen
          functions_code = """
          <script id="room-actions-runtime">
          window.startRoomWork = async function(rid) {
            try {
              let proj = (typeof p === "function") ? p() : null;
              let rooms = proj ? (proj.rooms || (proj.project && proj.project.rooms) || []) : [];
              let room = rooms.find(x => x.id === rid);
              if (!room) return;
              room.startedAt = Date.now();
              room.status = "in_progress";
              if (typeof fsProject === "function") await fsProject().update({ rooms: rooms });
              if (typeof render === "function") render();
              else if (typeof renderWorkflow === "function") renderWorkflow();
            } catch(e) { console.error(e); }
          };

          window.finishRoomWork = async function(rid) {
            try {
              let proj = (typeof p === "function") ? p() : null;
              let rooms = proj ? (proj.rooms || (proj.project && proj.project.rooms) || []) : [];
              let room = rooms.find(x => x.id === rid);
              if (!room) return;
              room.completedAt = Date.now();
              room.status = "completed";
              if (typeof fsProject === "function") await fsProject().update({ rooms: rooms });
              if (typeof render === "function") render();
              else if (typeof renderWorkflow === "function") renderWorkflow();
            } catch(e) { console.error(e); }
          };

          window.getRoomStatusSnippet = function(r) {
            let badge = '<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#fee2e2;color:#ef4444;">Offen</span>';
            if (r.completedAt || r.status === "completed") {
              badge = '<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#dcfce7;color:#16a34a;">Fertig</span>';
            } else if (r.startedAt || r.status === "in_progress") {
              badge = '<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#fef3c7;color:#d97706;">In Arbeit</span>';
            }

            let btn = "";
            if (!r.startedAt) {
              btn = '<button type="button" class="btn green" style="width:auto;padding:5px 12px;margin:0;font-size:12px;" onclick="event.stopPropagation();startRoomWork(\\'' + r.id + '\\')">▶ Start</button>';
            } else if (!r.completedAt) {
              btn = '<button type="button" class="btn green" style="width:auto;padding:5px 12px;margin:0;font-size:12px;background:#10b981;" onclick="event.stopPropagation();finishRoomWork(\\'' + r.id + '\\')">✔ Fertig</button>';
            }
            return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;margin:6px 0;border-bottom:1px solid #f1f5f9;">' + badge + btn + '</div>';
          };
          </script>
          """

          if 'id="room-actions-runtime"' in content:
              import re
              content = re.sub(r'<script id="room-actions-runtime">[\s\S]*?<\/script>', functions_code.strip(), content)
          else:
              content = content.replace("</head>", functions_code.strip() + "\n</head>")

          # 2. Direkt in wfRoomHtml verankern
          # Ersetzt die wfHead-Zeile durch das dynamische Status-Snippet
          old_wfhead = '<div class="wfHead">'
          new_wfhead = '<div class="wfHead">${typeof getRoomStatusSnippet === "function" ? getRoomStatusSnippet(r) : ""}'
          if old_wfhead in content and new_wfhead not in content:
              content = content.replace(old_wfhead, new_wfhead)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Permanently insert status snippet into wfRoomHtml template" || echo "Keine Aenderung"
          git push
