name: Inspect Firebase and Tabs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Firestore Referenzen und Tab Navigation pruefen
        run: |
          echo "=== FIRESTORE FUNKTIONEN (fs...) ==="
          grep -n "function fs" index.html || true

          echo "=== WIE WERDEN TEAMS GESPEICHERT / HINZUGEFUEGT ==="
          grep -n -C 6 "teams" index.html | grep -C 5 "update\|push\|add" || true

          echo "=== REITER / TAB WECHSEL LOGIK ==="
          grep -n -C 6 "function nav(" index.html || grep -n -C 6 "function showView" index.html || grep -n -C 6 "function setTab" index.html || true

          echo "=== DIE LETZTEN 60 ZEILEN VOR BODY ENDE ==="
          tail -n 60 index.html
