name: Find Monteur UI

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Textsuche nach Monteur und Admin
        run: |
          grep -in -C 3 -E "(monteur|createMonteur|admin)" index.html | head -n 40 || echo "Nichts gefunden"
