name: Patch index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: create-monteur.js in index.html einbinden
        run: |
          sed -i 's|</body>|<script src="create-monteur.js"></script>\n</body>|' index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Auto-patch: create-monteur.js eingebunden" || echo "Keine Aenderungen"
          git push
