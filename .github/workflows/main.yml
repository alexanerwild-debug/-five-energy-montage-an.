name: Inspect Auth and Roles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-roles:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Rollen, Login und Raum-Zuweisung pruefen
        run: |
          echo "=== COMPANY MODE / FIRMENUMSCHALTUNG ==="
          grep -n -C 5 "switchCompanyMode" index.html || grep -n -C 5 "companyMode" index.html || true

          echo "=== AUTH / ROLLE / USER PROFILE ==="
          grep -n -C 5 "onAuthStateChanged" index.html || grep -n -C 5 "isAdmin" index.html || true

          echo "=== RAEUME RENDERN / ZUWEISUNG TEAM ==="
          grep -n -C 6 "assigned" index.html || grep -n -C 6 "renderRooms" index.html || grep -n -C 6 "r.team" index.html || true
