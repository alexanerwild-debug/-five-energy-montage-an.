name: Add Sidebar Mode Switcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-switcher:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Umschalter ganz oben ins Seitenmenue integrieren
        run: |
          python3 -c '
          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Sicherstellen, dass keine alten Banner-Ueberreste vorhanden sind
          import re
          content = re.sub(r"<div id=\"company-switch-bar\"[\s\S]*?</div>", "", content)

          # 2. Umschalter direkt an die Spitze des Navigationsmenues setzen
          old_target = """<div class=\"navTitle\">FIV.ENERGY</div>"""
          if old_target not in content:
              old_target = """<div class=\"navTitle\">FIV.Energy</div>"""

          switcher_html = """<div style=\"padding: 12px 14px 8px 14px; border-bottom: 1px solid #e2e8f0; margin-bottom: 8px;\">
            <label style=\"display:block; font-size:11px; font-weight:700; color:#64748b; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Bereich wechseln</label>
            <select id=\"companyModeSelect\" onchange=\"window.switchCompanyMode(this.value)\" style=\"width:100%; padding:8px 10px; font-size:14px; font-weight:600; color:#1e293b; background:#f8fafc; border:1px solid #cbd5e1; border-radius:8px; outline:none;\">
              <option value=\"five-energy\">⚡ FIV.Energy</option>
              <option value=\"macbright\">💡 Macbright (Licht)</option>
            </select>
          </div>"""

          if old_target in content:
              content = content.replace(old_target, switcher_html, 1)

          # 3. Logik fuer den Wechsel und Merken des Status im Browser hinterlegen
          js_logic = """<script>
          window.switchCompanyMode = function(mode) {
            localStorage.setItem("selectedAppMode", mode);
            const titles = document.querySelectorAll(".navTitle, #dashTitle");
            titles.forEach(el => {
              if (el.id === "dashTitle") {
                el.innerText = mode === "macbright" ? "Macbright Licht" : "FIV.Energy";
              }
            });
          };

          document.addEventListener("DOMContentLoaded", function() {
            const savedMode = localStorage.getItem("selectedAppMode") || "five-energy";
            const sel = document.getElementById("companyModeSelect");
            if (sel) {
              sel.value = savedMode;
            }
            window.switchCompanyMode(savedMode);
          });
          </script>
          </body>"""

          if "</body>" in content and "window.switchCompanyMode" not in content:
              content = content.replace("</body>", js_logic, 1)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(content)
          '

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Add clean mode switcher inside navigation menu" || echo "Keine Aenderung"
          git push
