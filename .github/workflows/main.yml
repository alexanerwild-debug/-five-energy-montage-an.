name: Verify Index Content

on:
  workflow_dispatch:

jobs:
  check-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if script exists in index.html
        run: |
          echo "=== SUCHE NACH ROLES-DASHBOARD-SYSTEM ==="
          grep -n "roles-dashboard-system" index.html || echo "NICHT GEFUNDEN!"

          echo "=== LETZTE 40 ZEILEN VON INDEX.HTML ==="
          tail -n 40 index.html
