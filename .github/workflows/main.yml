name: Fix Safari Login Hang

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Firestore offline persistence deaktivieren
        run: |
          sed -i 's|enableIndexedDbPersistence|// enableIndexedDbPersistence|g' index.html
          sed -i 's|enableMultiTabIndexedDbPersistence|// enableMultiTabIndexedDbPersistence|g' index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Fix: IndexedDb persistence fuer Safari deaktiviert" || echo "Keine Aenderungen"
          git push
