name: Rollback To Working State

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: index.html auf funktionierenden Stand zuruecksetzen
        run: |
          git checkout 844beae -- index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Rollback: index.html auf funktionierenden Stand zurueckgesetzt" || echo "Keine Aenderung noetig"
          git push
